services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000}
        VITE_CONTRACT_ADDRESS: ${VITE_CONTRACT_ADDRESS}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Opsional: membuka backend ke internet lewat Cloudflare Tunnel.
  # Jalankan dengan: docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - backend
    restart: unless-stopped
    profiles: ["tunnel"]
